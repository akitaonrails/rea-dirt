[package]
name = "dirt-launcher"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runs the user's own copy of Colin McRae: DiRT (2007) on modern Windows and Linux"

[[bin]]
name = "DiRTLauncher"
path = "src/main.rs"

[dependencies]
rea-launcher.workspace = true
# Edits DiRT's hardware_settings XML attribute by attribute.
quick-xml.workspace = true

[target.'cfg(windows)'.dependencies]
rea-launcher-win32.workspace = true
rea-launcher-ui.workspace = true

# The palette test and the headless window tests (egui_kittest) run on the
# host and under sdk/scripts/wine-test.
[dev-dependencies]
# tests/audience.rs: the SDK's pure report::Audience rule, on the host too.
rea-launcher-win32.workspace = true
rea-launcher-ui = { workspace = true, features = ["testing"] }
