name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # The shared rea-launcher-sdk CI: formatting, host tests, cargo audit and
  # deny, sdk/ drift, shell syntax and the Linux helper and packaging tests,
  # Windows-target clippy, the release build, the lld and import checks, the
  # Windows-target tests under Wine (headless), packaging and the package
  # allowlist (sdk/docs/playbooks/ci-and-releases.md).
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.4.4
    with:
      rust-target: i686-pc-windows-gnu
      wine-tests: true
      package-command: |
        packaging/package.sh "dist/DiRTLauncher-$REA_VERSION_NAME"
        # DXVK sits where DiRTLauncher.exe looks for it, in the zip and the AppImage.
        test -f "dist/DiRTLauncher-$REA_VERSION_NAME/linux/d3d9.dll"
        appimage="$PWD/dist/DiRTLauncher-$REA_VERSION_NAME-x86_64.AppImage"
        (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null &&
          test -f squashfs-root/usr/lib/dirt/linux/d3d9.dll &&
          test -f squashfs-root/usr/lib/dirt/rea-play.sh && rm -rf squashfs-root)
      package-dir: dist/DiRTLauncher-*/
      package-allowlist: packaging/package.allow
      artifact-name: DiRTLauncher-packages
      artifact-paths: |
        dist/*.zip
        dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    # All three, even with attest: false (GitHub checks a called workflow's
    # permissions before any if:).
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.4.4
    with:
      package: dirt-launcher
      artifact-pattern: DiRTLauncher-*
